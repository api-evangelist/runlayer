errors:
- status: 401
  title: Unauthorized
  meaning: Missing or invalid API key, or an unauthenticated request.
  remediation: Send a valid key in the x-runlayer-api-key header, or complete OAuth/SSO.
- status: 403
  title: Forbidden
  meaning: The API key's role lacks access to the requested endpoint.
  remediation: Use a key whose personal/organization role grants the endpoint.
