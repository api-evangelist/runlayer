aid: runlayer
name: Runlayer
description: >-
  Runlayer (operated by Anysource Inc.) is an enterprise AI control plane and
  enablement layer for AI agents. It sits as a governed layer between the AI
  clients employees already use (Claude, Cursor, ChatGPT, Codex, GitHub Copilot,
  VS Code, Windsurf — 300+ clients) and company systems, connecting them to
  18,000+ MCP servers with identity, policy enforcement, runtime security
  (Runlayer Guard), and audit logging on every request. The platform pairs an
  MCP gateway, an agent builder (Runlayer Agents), a governed skills/plugins
  registry (Runlayer Catalog), agent IAM, shadow-AI discovery (Runlayer Watch),
  and observability. Developers get a tenant-scoped REST Management API
  (/api/v1), a first-party CLI, Python packages, an OAuth broker, and a platform
  self-MCP (Runlayer MCP). Backed by a $30M Series A from Felicis and Khosla
  Ventures (June 2026).
