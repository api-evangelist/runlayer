generated: '2026-07-21'
method: searched
status: published
source: https://docs.runlayer.com/runlayer-mcp
server:
  name: Runlayer MCP
  description: First-party "platform self-MCP" — a hosted Runlayer MCP server that lets an assistant query
    and manage Runlayer itself (audit logs, analytics, server inventory, policies, plugins, skills, agents).
    Distinct from the Runlayer Plugin unified connector entrypoint. All calls are governed by the caller's
    Runlayer permissions and recorded in Audit Logs.
  transport: http
  hosted: true
  auth: OAuth/SSO (interactive) or Agent Account M2M/OBO token (RFC 8693)
tools:
- name: list_audit_events
  description: List recent audit events with filters (action/resource/actor/correlation id/request id/client).
- name: get_audit_event
  description: Fetch a single audit log entry with full detail.
- name: export_audit_logs
  description: Bulk export audit logs as JSON or CSV (up to 10,000 rows/call, no 90-day hot-window limit).
- name: export_analytics
  description: Export dashboard datasets as CSV (admin-only) — top tools/users/servers over a date range.
- name: export_server_health
  description: Export per-server tool health + usage breakdowns as CSV.
- name: list_servers
  description: List MCP servers/connectors the caller can access.
- name: get_server
  description: Get server details and generate MCP client install links (Cursor / VS Code).
- name: list_server_tools
  description: List tools/resources/prompts exposed by a server (via the Runlayer proxy).
- name: manage_governance
  description: Inspect/maintain policies, access requests, plugins, skills, and agents (admin/owner gated,
    confirm-required).
notes: Runlayer is itself an MCP gateway fronting 18,000+ MCP servers for 300+ AI clients; the Runlayer
  Plugin unified endpoint exposes connector tools via two meta-tools (search_tools, execute_tool) at /api/v1/proxy/runlayer/mcp.
  This artifact captures the platform self-MCP, which is the discrete first-party server.
